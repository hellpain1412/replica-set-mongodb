    image: percona/mongodb_exporter:0.40
    hostname: mongo_exporter
    container_name: mongo_exporter
    restart: unless-stopped
    networks:
      - mongo_net
    ports:
      - "9216:9216"
    volumes:
      - ./certs:/opt/ssl:ro,Z
    environment:
