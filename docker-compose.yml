x-mongo-common: &mongo_common
  build:
    context: .
    args: 
      MONGO_VER: ${MONGO_VER}
  image: "mongo-numa:${MONGO_VER}"
  restart: unless-stopped
  security_opt:
    - seccomp:./seccomp/seccomp-numa.json 
  user: "999:999"
  environment:
    TZ: ${TZ}
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
  ulimits:
    nofile:
      soft: 64000
      hard: 64000
    nproc:  16000
    
  networks: [mongo_net]
  healthcheck:
    test:
      - CMD-SHELL
      - |
        mongosh --tls \
          --tlsCAFile /mongo/ssl/ca.pem \
          --tlsCertificateKeyFile /mongo/ssl/node.pem \
          --quiet --eval "db.runCommand({ping:1}).ok" || exit 1
    interval: 30s
    timeout: 10s
    retries: 3

volumes:
  mongo1_data:
  mongo1_config:
  mongo2_data:
  mongo2_config:
  mongo3_data:
  mongo3_config:

networks:
  mongo_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  mongo1:
    <<: *mongo_common
    container_name: mongo1
    hostname: mongo1
    environment:
      NODE_CERT: mongo1.pem
      NUMA_INTERLEAVE: "1"
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
      - mongo1_config:/data/configdb
      - ./certs:/opt/ssl:Z
      - ./keyfile:/opt/keyfile:Z
    networks:
      mongo_net:
        ipv4_address: 172.20.0.11
    

  mongo2:
    <<: *mongo_common
    container_name: mongo2
    hostname: mongo2
    environment:
      NODE_CERT: mongo2.pem
      NUMA_INTERLEAVE: "1"
    # NUMA_NODE: "1"
    # DISABLE_INTERLEAVE: "1"
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
      - mongo2_config:/data/configdb
      - ./certs:/opt/ssl:Z
      - ./keyfile:/opt/keyfile:Z
    depends_on:
      - mongo1
    networks:
      mongo_net:
        ipv4_address: 172.20.0.12
    

  mongo3:
    <<: *mongo_common
    container_name: mongo3
    hostname: mongo3
    environment:
      NODE_CERT: mongo3.pem
      NUMA_INTERLEAVE: "1"
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
      - mongo3_config:/data/configdb
      - ./certs:/opt/ssl:Z
      - ./keyfile:/opt/keyfile:Z
    depends_on:
      - mongo1
    networks:
      mongo_net:
        ipv4_address: 172.20.0.13
    
